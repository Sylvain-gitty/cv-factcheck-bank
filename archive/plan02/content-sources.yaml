# ============================================================================
# VOICE
# ============================================================================
# Fed to the drafting prompt, and the ban-list is checked mechanically afterwards.
voice:
  # Excerpts of your own writing. The tone to match: direct, comfortable stating what did
  # not work, allergic to marketing language.
  samples:
    - "The interesting part is not the accuracy number."
    - >
      The obvious move is to embed each paper and train a classifier. We did that, and it
      scored well — right up until we tested it on a research question it hadn't seen.
    - >
      Two honest caveats we'd rather state than bury.

  ban:
    - delve
    - "in today's fast-paced"
    - leverage
    - game-changer
    - unlock
    - "it's important to note"
    - "it is important to note"
    - seamless
    - robust solution
    - cutting-edge
    - "revolutionize"
    - "in conclusion"
    - "dive into"
    - "at the end of the day"
    - "needless to say"

  rules:
    - No section shorter than a paragraph.
    - No bullet list longer than five items.
    - Define a term the first time it appears.
    - Every number traces to the evidence pack. No exceptions.
    - Say "we" on co-authored and team work. Every time.


# ============================================================================
# POSITIONING
# ============================================================================
# Primary goal is hiring signal; the consulting brand is built quietly underneath and the
# offer stays latent while job hunting.
#
# THE RULE THAT SERVES BOTH: write about the problem, not about yourself.
#
#   not  "What I learned about imbalanced classification in my bootcamp capstone"
#   not  "How I help R&D teams screen literature"
#   but  "Why F1 is the wrong metric for literature screening — and what we used instead"
#
# Problem-centric titles are audience-agnostic. A hiring manager sees someone who thinks
# clearly; a buyer sees someone who understands their problem; neither is being sold to.
positioning:
  cadence_days: 14           # one pillar a fortnight. The job search wins ties.
  target_words: [1200, 2000]
  self_centric_openers:      # checked against the title
    - "what i learned"
    - "my journey"
    - "how i built"
    - "my experience with"
    - "a beginner's guide"
    - "how i help"
