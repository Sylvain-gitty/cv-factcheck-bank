# content-sources.yaml — Plan 02 A0: what may become an article, and under whose name.
#
# ============================================================================
# THIS FILE IS AN ALLOW-LIST. IT IS NEVER A FOLDER SCAN.
# ============================================================================
#
# In August 2026 nine CV facts were seeded from `academic_research_agent` and
# `data_sci_virtual_coaches` on the assumption that a directory sitting in a personal
# Bootcamp folder was personal work. Both belong to Warren Fauvel — 378 commits,
# proprietary licence, all rights reserved. One of the facts claimed sole authorship of
# the application.
#
# It was caught before anything was sent. Published as an article it would not have been.
#
# The rule that follows: **authorship comes from `git log` and the LICENSE, never from a
# README.** A README describes software; it does not say who wrote it. Before adding any
# repo below:
#
#     git -C <repo> log --format=%an | sort | uniq -c | sort -rn
#     head -5 <repo>/LICENSE
#
# `authorship` and `share` are inherited by every draft and every check downstream.

repos:
  - id: tiri
    label: TIRI — relevance screening for academic literature
    path: ../../TIRI---The-Data-science-project
    url: https://github.com/Sylvain-gitty/TIRI---The-Data-science-project
    authorship: co-authored
    collaborators: ["Warren Fauvel"]
    share: ~27%          # ~50 of ~187 commits. Say "we" throughout; never "I built".
    entity: ent-tiri     # links to the fact bank, so evidence resolves to verified facts
    lens: [ds]
    publishable: true
    evidence_files:
      - README.md
      - CONTEXT.md
      - data/processed/README.md
    figures: reports/

  - id: airpollution
    label: Urban air pollution — PM2.5 from satellite data
    path: ../../DS-airpollutionproject
    url: https://github.com/Sylvain-gitty/DS-airpollutionproject
    authorship: team
    collaborators: [Andrea, Ghada]
    share: one of three
    entity: ent-airpollution
    lens: [ds]
    publishable: true
    evidence_files: [README.md]
    figures: images/

  - id: cvfactbank
    label: cv-fact-bank — the tooling behind this job search
    path: .
    url: https://github.com/Sylvain-gitty/cv-factcheck-bank
    authorship: sole
    collaborators: []
    share: >
      Design and direction are Sylvain's; implementation was AI-assisted. Any article
      about this must say so plainly in the piece, not only in a footnote.
    entity: ent-n8n-automation
    lens: [pm, ds]
    publishable: true
    evidence_files: [README.md, n8n/README.md]
    figures: null


