# sources.yaml — Plan 01 Stage 1: where jobs come from.
#
# Every source below was tested on 2026-09-01. Status is what the server actually returned,
# not what a blog post claims. Re-test before assuming any of it still holds.
#
# THE RULE: use the access route the site offers. An official API, a published RSS feed, or
# an alert email you subscribed to. Not scraping. Not because scraping is hard, but because
# the downside is losing the account you are job-searching with, in the middle of a job
# search. That trade is never worth it.

rules:
  # Stage 2a — free deterministic filtering, applied before anything expensive.
  # Kills the majority of postings at zero cost. Edit these weekly; they are meant to churn.
  # POSITIVE gate first. Dropping what you do not want is not the same as keeping what you
  # do: the first real run returned MOT Testers, Shunters and a Handyperson, because
  # "remote" on its own admits every job on the planet. A title must earn its way in.
  # Matched on WORD BOUNDARIES, so "ai" no longer hits retail/maintenance/captain/mail.
  require_any_in_title:
    - data
    - machine learning
    - ml
    - ai
    - analyst
    - analytics
    - scientist
    - science
    - python
    - nlp
    - llm
    - research
    - statistics
    - quantitative
    - bioinformatics
    - product manager
    - product owner

  # "Remote" on these boards usually means "remote, within the United States".
  # Explicit restrictions only. These are the phrases that actually rule you out, as
  # opposed to a country name that merely says where the company sits.
  drop_if_region_locked:
    - "must be based in"
    - "must be located in"
    - "must reside in"
    - "only candidates located in"
    - "only candidates based in"
    - "eligible to work in the us"
    - "authorized to work in the us"
    - "authorised to work in the us"
    - "work authorization in the united states"
    - "us citizens only"
    - "requires us citizenship"
    - "us only"
    - "usa only"
    - "u.s. only"
    - "united states only"
    - "must be located in the us"
    - "must reside in the united states"
    - "authorized to work in the us"
    - "canada only"
    - "uk only"
    - "australia only"
    - "philippines"
    - "latam only"
    - "india only"

  # A remote job based in another country is fine -- you can take it from Berlin. Country
  # names are NOT filtered: "Remote - Singapore" usually means the company is in Singapore
  # and hires remotely. Only an explicit RESTRICTION disqualifies, and those are phrases,
  # not place names -- see drop_if_region_locked below.

  drop_unknown_location: true      # unknown is not the same as allowed

  # No single source may contribute more than this per run. A 767-posting board is not
  # more important than a 12-posting one; without a cap it simply drowns it out.
  max_per_source: 8

  countries_allow: [DE, EU, REMOTE]
  languages_allow: [en, de]
  drop_title_contains:
    - no experience required     # data-labelling gig work, not a data role
    - senior
    - principal
    - staff
    - lead
    - head of
    - director
    - vp
    - "10+ years"
    - "8+ years"
    - werkstudent
    - praktikum
    - intern
  drop_description_contains:
    - security clearance
    - unpaid
    - commission only
  min_description_chars: 200      # a 40-word posting is an agency stub


# ---------------------------------------------------------------------------
# TIER 1 — verified working, automated access permitted
# ---------------------------------------------------------------------------
sources:

  - id: remoteok
    label: RemoteOK
    type: json_api
    enabled: true
    url: https://remoteok.com/api
    # Verified 2026-09-01: HTTP 200, ~411 KB JSON.
    # Their payload carries its own licence line: "Please link back (with follow)".
    # If you ever publish anything derived from this feed, honour that.
    attribution: "Jobs via RemoteOK — https://remoteok.com"
    skip_first_record: true        # element 0 is the licence notice, not a job
    map:
      id: id
      title: position
      company: company
      location: location
      url: url
      posted_at: date
      description: description
      salary_raw: salary_max
      tags: tags
    defaults: {remote_flag: true, language: en}

  - id: workingnomads
    label: Working Nomads
    type: json_api
    enabled: true
    url: https://www.workingnomads.com/api/exposed_jobs/
    # Verified 2026-09-01: HTTP 200, ~196 KB JSON.
    map:
      id: id
      title: title
      company: company_name
      location: location
      url: url
      posted_at: pub_date
      description: description
      tags: category_name
    defaults: {remote_flag: true, language: en}

  - id: berlinstartupjobs
    label: Berlin Startup Jobs
    type: rss
    enabled: true
    url: https://berlinstartupjobs.com/feed/
    # Verified 2026-09-01: HTTP 200, valid RSS 2.0.
    # Only ~15 KB per fetch, so it returns recent postings only. Run it daily or you
    # will miss things -- this is the source most sensitive to schedule.
    defaults: {location: "Berlin, Germany", remote_flag: false, language: en}

  - id: arbeitnow
    label: Arbeitnow
    type: json_api
    enabled: true
    url: https://www.arbeitnow.com/api/job-board-api
    # Verified 2026-09-01: HTTP 200, ~1.4 MB JSON. Documented free API, German market.
    # Not on your list, but it covers the German-market gap the blocked sites leave.
    root: data
    map:
      id: slug
      title: title
      company: company_name
      location: location
      url: url
      posted_at: created_at
      description: description
      tags: tags
    defaults: {language: de}

  # --- added 2026-09-01 after testing candidate endpoints directly -------------
  # All six verified returning HTTP 200 with parseable payloads on that date.
  # Whether each EARNS its place is a separate question, measured after the fact:
  # a source that returns 500 postings and contributes nothing past the filter is
  # cost without value. See the yield table in README.md.

  - id: workable-berlin
    label: Workable — Berlin, data
    type: json_api
    enabled: true
    url: https://jobs.workable.com/api/v1/jobs
    params: {query: data, location: Berlin}
    root: jobs
    map:
      id: id
      title: title
      company: company
      location: locations
      url: url
      posted_at: created
      description: description
    defaults: {language: en}

  - id: workable-ml
    label: Workable — Berlin, machine learning
    type: json_api
    enabled: false
    # DISABLED 2026-09-01. Redundant by construction: the "data" query already returns
    # these, and 2 of its 6 results were caught as duplicates of workable-berlin. Re-enable
    # only if you narrow workable-berlin's query.
    url: https://jobs.workable.com/api/v1/jobs
    params: {query: machine learning, location: Berlin}
    root: jobs
    map:
      id: id
      title: title
      company: company
      location: locations
      url: url
      posted_at: created
      description: description
    defaults: {language: en}

  - id: remotive
    label: Remotive
    type: json_api
    enabled: true
    url: https://remotive.com/api/remote-jobs
    root: jobs
    map:
      id: id
      title: title
      company: company_name
      location: candidate_required_location
      url: url
      posted_at: publication_date
      description: description
      salary_raw: salary
      tags: tags
    defaults: {remote_flag: true, language: en}

  - id: jobicy
    label: Jobicy
    type: json_api
    enabled: true
    url: https://jobicy.com/api/v2/remote-jobs?count=50
    root: jobs
    map:
      id: id
      title: jobTitle
      company: companyName
      location: jobGeo
      url: url
      posted_at: pubDate
      description: jobDescription
      tags: jobIndustry
    defaults: {remote_flag: true, language: en}

  - id: himalayas
    label: Himalayas
    type: json_api
    enabled: true
    url: https://himalayas.app/jobs/api?limit=50
    root: jobs
    map:
      id: guid
      title: title
      company: companyName
      location: locationRestrictions
      url: applicationLink
      posted_at: pubDate
      description: description
      tags: categories
    defaults: {remote_flag: true, language: en}

  - id: weworkremotely
    label: We Work Remotely — programming
    type: rss
    enabled: true
    url: https://weworkremotely.com/categories/remote-programming-jobs.rss
    defaults: {remote_flag: true, language: en}

  - id: themuse
    label: The Muse
    type: json_api
    enabled: false
    # DISABLED 2026-09-01. 20 fetched, 20 filtered, 0 kept -- but the reason is structural,
    # not a bad sample: US-centric (first page was Burbank, CA) across 20,442 pages of
    # largely non-technical roles. Running it more will not make it a Berlin DS source.
    url: https://www.themuse.com/api/public/jobs?page=1
    root: results
    map:
      id: id
      title: name
      company: company
      location: locations
      url: refs.landing_page
      posted_at: publication_date
      description: contents
      tags: categories
    defaults: {language: en}

  - id: landingjobs
    label: Landing.jobs — EU tech
    type: json_api
    enabled: true
    url: https://landing.jobs/api/v1/jobs?limit=50
    map:
      id: id
      title: title
      company: company_name
      location: locations
      url: url
      posted_at: published_at
      description: role_description
    defaults: {language: en}

  - id: bundesagentur
    label: Bundesagentur für Arbeit — Jobsuche
    type: json_api
    enabled: false
    # DISABLED until you register. Free, official, and by far the best German coverage.
    # Register at https://jobsuche.api.bund.dev/ for a client ID, then set
    # BA_CLIENT_ID in the environment and flip enabled: true.
    url: https://rest.arbeitsagentur.de/jobboerse/jobsuche-service/pc/v4/jobs
    auth_env: BA_CLIENT_ID
    auth_header: X-API-Key
    params: {wo: Berlin, umkreis: 50, size: 100}
    root: stellenangebote
    map:
      id: refnr
      title: titel
      company: arbeitgeber
      location: arbeitsort
      url: externeUrl
      posted_at: aktuelleVeroeffentlichungsdatum
      description: stellenbeschreibung
    defaults: {language: de}


# ---------------------------------------------------------------------------
# TIER 2 — automated access NOT permitted or NOT available
# ---------------------------------------------------------------------------
#
# All tested 2026-09-01. Do not "fix" these by scraping them.
#
#   indeed.de            robots.txt disallows job paths. Publisher API long discontinued.
#                        Actively blocks automation and has litigated over it.
#   stepstone.de         robots.txt disallows /jobs/ paths.
#   xing.com             robots.txt carries a blanket "Disallow: /". Job API deprecated.
#   jobleads.com         robots.txt disallows /jobs/global/.
#   welcometothejungle   HTTP 403 on the API and on robots.txt itself.
#   justjoin.it          public API returns 503 / 404. No working endpoint.
#   relocate.me          no feed found (no /jobs.rss, no /feed).
#   eurojobs.com         no feed found.
#
# THE ROUTE THAT WORKS FOR ALL OF THEM: subscribe to their job alert emails.
#
# You use the service exactly as designed, they push matches to you, and n8n reads the
# mailbox. It is legal, it survives redesigns that break scrapers, and it cannot get your
# account banned. The catch is that you only see what their matching decides to send --
# so make the alert criteria broad and let Stage 2 do the filtering, rather than
# pre-filtering in their UI.
#
# Setup:
#   1. Create a dedicated address or a +tag: fossiersylvain+jobs@outlook.fr
#   2. Subscribe to alerts on each site above with deliberately broad criteria
#   3. In n8n: IMAP Email trigger -> filter by sender -> parse -> same schema as below
#
# `email_alert` sources are declared here so the pipeline knows about them, but
# discover.py does not fetch them -- n8n owns that trigger.
email_alert_sources:
  - {id: indeed,      label: Indeed.de,             sender_contains: indeed.com}
  - {id: stepstone,   label: StepStone.de,          sender_contains: stepstone.de}
  - {id: xing,        label: XING,                  sender_contains: xing.com}
  - {id: jobleads,    label: JobLeads,              sender_contains: jobleads.com}
  - {id: wttj,        label: Welcome to the Jungle, sender_contains: welcometothejungle.com}
  - {id: justjoin,    label: justjoin.it,           sender_contains: justjoin.it}
  - {id: relocateme,  label: Relocate.me,           sender_contains: relocate.me}
  - {id: eurojobs,    label: EuroJobs,              sender_contains: eurojobs.com}


# ---------------------------------------------------------------------------
# TIER 0 — the source worth more than all of the above
# ---------------------------------------------------------------------------
#
# Company career boards. Greenhouse, Lever, Ashby and Personio all expose public JSON per
# company, and using it is entirely legitimate -- it is how their embed widgets work.
#
# This is the tier juniors skip and it is the best one: you choose the 30-50 employers you
# actually want, and you see their openings the day they post, before any aggregator
# indexes them. Higher signal and far less noise than every board above combined.
#
# Add companies here as you identify them. Templates:
#   https://boards-api.greenhouse.io/v1/boards/<token>/jobs?content=true
#   https://api.lever.co/v0/postings/<token>?mode=json
#   https://api.ashbyhq.com/posting-api/job-board/<token>
#   https://<company>.jobs.personio.de/xml
# Verified 2026-09-01 by probing 51 candidate tokens; 16 resolved with live postings.
# Most 404s were companies on a different ATS, not companies without a board -- so a miss
# is worth re-probing across all four patterns before giving up on an employer.
#
# ADD THE EMPLOYERS YOU ACTUALLY WANT. That is the entire point of this tier: you choose
# the list, so there is no aggregator noise and no recruiter spam in it.
company_boards:
  # --- AI / ML first ---
  - {label: Helsing,        type: greenhouse, token: helsing}          # defence AI, Munich/Berlin
  - {label: Celonis,        type: greenhouse, token: celonis}          # process mining, Munich
  - {label: OpenAI,         type: ashby,      token: openai}           # Munich/Zurich/London
  - {label: Langdock,       type: ashby,      token: langdock}         # LLM platform, Berlin
  - {label: Sereact,        type: ashby,      token: sereact}          # robotics AI, Stuttgart
  - {label: Tacto,          type: ashby,      token: tacto}            # supply-chain AI, Munich

  # --- Berlin tech, data-heavy ---
  - {label: N26,            type: greenhouse, token: n26}
  - {label: GetYourGuide,   type: greenhouse, token: getyourguide}
  - {label: Raisin,         type: greenhouse, token: raisin}
  - {label: Contentful,     type: greenhouse, token: contentful}
  - {label: Trade Republic, type: greenhouse, token: traderepublic}
  - {label: HelloFresh,     type: greenhouse, token: hellofresh}
  - {label: SumUp,          type: greenhouse, token: sumup}
  - {label: Flix,           type: greenhouse, token: flix}
  - {label: Doctolib,       type: greenhouse, token: doctolib}

  # Probed and NOT on these ATSs (all 404): Zalando, Delivery Hero, SoundCloud, Babbel,
  # Taxfix, Forto, DeepL, Wayfair, TIER, wefox, Aleph Alpha, Grover, Choco, Pitch,
  # Solaris, Mistral, deepset, QuantCo, Jina, Synthesia, Scoutbee, Merantix,
  # Black Forest Labs. Personio boards (Enpal, 1KOMMA5) rate-limited at 429 -- retry.
  # They may use SmartRecruiters, Workday, Join, or their own careers page.
