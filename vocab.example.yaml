# vocab.example.yaml — copy to vocab.yaml and edit.
#
#     cp vocab.example.yaml vocab.yaml
#
# The controlled vocabulary for skill tags.
#
# WHY THIS FILE EXISTS
# Free-text tags drift. Within a month you will have "sklearn", "scikit-learn" and
# "Scikit-Learn" as three different tags, and your Stage 3 retrieval will silently return
# two thirds of the facts it should. Nothing errors. The CV is just quietly worse.
#
# This is the most common and least visible data-quality failure in small hand-built
# datasets, and the fix is boring: one canonical id per concept, aliases mapped to it,
# a validator that rejects anything unlisted.
#
# Rule: adding a skill is a deliberate act. If validate.py rejects a tag, either fix the
# tag or add the skill here on purpose. Never "just allow unknown tags".
#
# Optional per skill: `cv_claimed: true` marks a skill your CV asserts. validate.py then
# reports any such skill with no fact behind it -- each one is a question you could be
# asked and could not answer with a story. Left unset here; set it on your own copy.

